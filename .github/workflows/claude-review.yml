name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize]

# A new push cancels the review still running on the previous commit.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Dependabot and fork PRs can't read repo secrets, so the job would only fail,
    # and reviewing every dependency bump wastes usage.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the "Review focus" section of CLAUDE.md.
            Report only real problems in the changed code: bugs, regressions, and the
            risks listed there. Skip style nitpicks and anything ESLint or tsc already
            catches. Keep every comment short and concrete.

            Use the inline comment tool for line-specific findings and `gh pr comment`
            for one brief top-level summary. If you find nothing worth raising, say so
            in a single sentence.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
